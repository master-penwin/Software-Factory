<!-- looks/neon.html — NEON ARCADE look for the odd-one-out loop. Visual layer only; logic identical to ../index.html. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd One Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07060d; --tile: #15122a; --tile-edge: #2c2650; --ink: #f4f1ff; --dim: #8f88b8;
    --pink: #ff2e63; --cyan: #2ec8ff; --lime: #3dff8f; --amber: #ffb300; --violet: #c86bff;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; font: 600 18px/1.3 'Chakra Petch', system-ui, sans-serif; color: var(--ink); background:
    radial-gradient(120% 60% at 50% 0%, #1d0f3a 0%, transparent 60%),
    radial-gradient(100% 50% at 50% 100%, #0b2238 0%, transparent 60%), var(--bg); min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px; min-height: 100vh; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  .screen.on { display: flex; }
  #round { justify-content: flex-start; gap: 16px; padding-top: 8px; }
  #stage { padding: 8px 0; }
  #stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0; font: 400 52px/0.95 'Bungee', 'Impact', sans-serif; letter-spacing: 1px; color: #fff;
    text-shadow: 0 0 2px #fff, 0 0 10px var(--pink), 0 0 26px var(--pink); }
  h1 .c { color: #fff; text-shadow: 0 0 2px #fff, 0 0 10px var(--cyan), 0 0 26px var(--cyan); }
  .tag { margin: 0; color: var(--dim); font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  .tag b { color: var(--lime); text-shadow: 0 0 8px rgba(61,255,143,.6); }
  button.big { font: 400 26px 'Bungee', 'Impact', sans-serif; letter-spacing: 2px; padding: 16px 52px; min-height: 64px; color: #07060d;
    border: 0; border-radius: 14px; background: var(--lime); cursor: pointer;
    box-shadow: 0 0 0 2px #b8ffd6 inset, 0 0 18px rgba(61,255,143,.7), 0 6px 0 #138a48; }
  button.big:active { transform: translateY(4px); box-shadow: 0 0 0 2px #b8ffd6 inset, 0 0 12px rgba(61,255,143,.6), 0 2px 0 #138a48; }
  .demo { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; margin: 8px 0; }
  .demo span { aspect-ratio: 1; border-radius: 12px; background: var(--tile); border: 1px solid var(--tile-edge); }
  .demo svg { width: 100%; height: 100%; display: block; }
  .demo .hit { outline: 3px solid var(--lime); outline-offset: 2px; box-shadow: 0 0 16px rgba(61,255,143,.6); }
  /* HUD */
  .hud { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; }
  .hud .k { display: block; font-size: 13px; letter-spacing: 3px; color: var(--dim); text-align: left; }
  .hud .r .k, .hud .r b { text-align: right; }
  .hud b { display: block; font: 400 72px/0.95 'Bungee', 'Impact', sans-serif; color: #fff; text-shadow: 0 0 10px var(--cyan); }
  .hud .r b { font-size: 34px; color: var(--amber); text-shadow: 0 0 10px rgba(255,179,0,.6); }
  .bar { width: 100%; height: 22px; padding: 3px; border-radius: 11px; background: #0d0b1c; border: 1px solid var(--tile-edge); }
  .bar div { height: 100%; width: 100%; border-radius: 8px;
    background: linear-gradient(90deg, var(--pink), var(--amber) 45%, var(--lime));
    box-shadow: 0 0 10px rgba(255,46,99,.6), 0 0 18px rgba(61,255,143,.35); }
  .hint { margin: 0 0 12px; font-size: 15px; color: #b9b2e0 !important; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  /* grid */
  #grid { width: 100%; display: grid; gap: 8px; touch-action: manipulation; border-radius: 14px; }
  #grid.ok { animation: ok 220ms ease-out; }
  @keyframes ok { from { box-shadow: 0 0 0 3px var(--lime), 0 0 36px rgba(61,255,143,.7); } }
  #grid button { padding: 0; border: 1px solid var(--tile-edge); border-radius: 12px; background: #15122a;
    background-image: radial-gradient(circle at 50% 0%, rgba(120,90,255,.10), transparent 70%); aspect-ratio: 1; min-width: 44px;
    cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); transition: transform 80ms; }
  #grid button:active { transform: scale(.96); }
  #grid button.odd { outline: 4px solid var(--lime); outline-offset: 1px; box-shadow: 0 0 22px rgba(61,255,143,.8); position: relative; z-index: 1; }
  #grid button.wrong { outline: 4px solid var(--pink); outline-offset: 1px; box-shadow: 0 0 22px rgba(255,46,99,.8); }
  #grid svg { width: 100%; height: 100%; display: block; }
  /* game over */
  .final { display: flex; flex-direction: column; gap: 4px; }
  .final .k { font-size: 14px; letter-spacing: 4px; color: var(--dim); }
  #final { font: 400 104px/1 'Bungee', 'Impact', sans-serif; color: #fff; text-shadow: 0 0 4px #fff, 0 0 18px var(--cyan), 0 0 40px var(--cyan); }
  .bestline { font-size: 18px; letter-spacing: 3px; color: var(--dim); }
  #best2 { font: 400 26px 'Bungee', 'Impact', sans-serif; color: var(--amber); text-shadow: 0 0 10px rgba(255,179,0,.6); margin-left: 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Glow sits UNDER a crisp copy of the shapes, so edges and counts stay sharp. -->
  <filter id="glow" x="-0.3" y="-0.3" width="1.6" height="1.6">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.03" result="b"/>
    <feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="1.8"/></feComponentTransfer>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>
<main>
  <section id="start" class="screen on">
    <h1>ODD<br><span class="c">ONE</span><br>OUT</h1>
    <div class="demo" aria-hidden="true"><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.7" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.5" cy="0.7" r="0.12" fill="#ff2e63"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.7" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.5" cy="0.7" r="0.12" fill="#2ec8ff"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#3dff8f"/><circle cx="0.7" cy="0.32" r="0.12" fill="#3dff8f"/><circle cx="0.5" cy="0.7" r="0.12" fill="#3dff8f"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.7" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.5" cy="0.7" r="0.12" fill="#ff2e63"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.7" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.5" cy="0.7" r="0.12" fill="#2ec8ff"/></g></svg></span><span class="hit"><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#3dff8f"/><circle cx="0.7" cy="0.32" r="0.12" fill="#3dff8f"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.7" cy="0.32" r="0.12" fill="#ff2e63"/><circle cx="0.5" cy="0.7" r="0.12" fill="#ff2e63"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.7" cy="0.32" r="0.12" fill="#2ec8ff"/><circle cx="0.5" cy="0.7" r="0.12" fill="#2ec8ff"/></g></svg></span><span><svg viewBox="0 0 1 1"><g filter="url(#glow)"><circle cx="0.3" cy="0.32" r="0.12" fill="#3dff8f"/><circle cx="0.7" cy="0.32" r="0.12" fill="#3dff8f"/><circle cx="0.5" cy="0.7" r="0.12" fill="#3dff8f"/></g></svg></span></div>
    <p class="tag">Tap the tile that <b>breaks the rule</b></p>
    <button class="big" id="play">Play</button>
  </section>
  <section id="round" class="screen">
    <div class="hud"><span><span class="k">SCORE</span><b id="score">0</b></span><span class="r"><span class="k">BEST</span><b id="best1">0</b></span></div>
    <div class="bar"><div id="timer"></div></div>
    <div id="stage"><div id="grid"></div></div>
    <p class="hint">Find the odd one</p>
  </section>
  <section id="over" class="screen">
    <h1>GAME<br><span class="c">OVER</span></h1>
    <div class="final"><span class="k">SCORE</span><b id="final">0</b></div>
    <p class="bestline">BEST<b id="best2">0</b></p>
    <button class="big" id="replay">Replay</button>
  </section>
</main>
<script type="module">
import { makeGrid } from '../rules.js';
import { difficulty } from '../difficulty.js';

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
// Visual only: rules.js color tokens -> neon palette (each >= 3:1 vs tile bg #15122a).
const NEON = { '#ff0000': '#ff2e63', '#0000ff': '#2ec8ff', '#008000': '#3dff8f', '#c05800': '#ffb300', '#800080': '#c86bff' };

const LOCK_MS = 250, REVEAL_MS = 600, REPLAY_LOCK_MS = 500;
let state = 'start', score = 0, grid = null, seed = 1, timeout = 0, readyAt = 0, overAt = 0;
const now = () => performance.now();
window.__game = { get state() { return state; }, get breakerIndex() { return grid ? grid.breakerIndex : -1; },
  get ready() { return state === 'round' && now() >= readyAt; } };

const loadBest = () => { try { return +localStorage.getItem('best') || 0; } catch { return 0; } };
const saveBest = (v) => { try { localStorage.setItem('best', String(v)); } catch {} };

function show(name) {
  state = name;
  for (const s of ['start', 'round', 'over']) $(s).classList.toggle('on', s === name);
}

function shapeEl({ x, y, shape, color }, r) {
  let el;
  if (shape === 'circle') {
    el = document.createElementNS(NS, 'circle');
    el.setAttribute('cx', x); el.setAttribute('cy', y); el.setAttribute('r', r);
  } else if (shape === 'square') {
    const s = r * 1.6;
    el = document.createElementNS(NS, 'rect');
    el.setAttribute('x', x - s / 2); el.setAttribute('y', y - s / 2); el.setAttribute('width', s); el.setAttribute('height', s);
  } else {
    el = document.createElementNS(NS, 'polygon');
    el.setAttribute('points', `${x},${y - r} ${x + r * 0.95},${y + r * 0.7} ${x - r * 0.95},${y + r * 0.7}`);
  }
  el.setAttribute('fill', NEON[color] || color);
  return el;
}

function tileButton(tile, i, r) {
  const b = document.createElement('button');
  b.dataset.i = i;
  b.setAttribute('aria-label', `tile ${i + 1}`);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 1 1');
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('filter', 'url(#glow)');
  tile.items.forEach((it) => g.appendChild(shapeEl(it, r)));
  svg.appendChild(g);
  b.appendChild(svg);
  return b;
}

function nextRound() {
  clearTimeout(timeout);
  const { size, variety, rule, seconds, countRange, extraUniques } = difficulty(score + 1, seed);
  const ROUND_MS = seconds * 1000;
  grid = makeGrid({ size, variety, rule, countRange, extraUniques });
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${Math.sqrt(size)}, 1fr)`;
  g.replaceChildren(...grid.tiles.map((t, i) => tileButton(t, i, grid.itemR)));
  $('score').textContent = score;
  $('best1').textContent = Math.max(score, loadBest());
  show('round'); // visible before the bar restarts, or the transition never runs
  readyAt = now() + LOCK_MS; // swallow the second tap of a double tap
  const bar = $('timer');
  bar.style.transition = 'none'; bar.style.width = '100%';
  bar.offsetWidth; // restart the transition
  bar.style.transition = `width ${ROUND_MS}ms linear`; bar.style.width = '0%';
  timeout = setTimeout(lose, ROUND_MS);
}

function lose(wrong) { // show the true odd tile (and the wrong tap) before game over
  clearTimeout(timeout);
  state = 'reveal';
  const bar = $('timer');
  bar.style.width = getComputedStyle(bar).width; bar.style.transition = 'none';
  $('grid').children[grid.breakerIndex].classList.add('odd');
  wrong?.classList.add('wrong');
  timeout = setTimeout(gameOver, REVEAL_MS);
}

function gameOver() {
  overAt = now();
  const best = Math.max(score, loadBest());
  saveBest(best);
  $('final').textContent = score;
  $('best2').textContent = best;
  show('over');
}

$('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || state !== 'round' || now() < readyAt) return;
  if (+b.dataset.i !== grid.breakerIndex) return lose(b);
  score++;
  const g = $('grid'); g.classList.remove('ok'); g.offsetWidth; g.classList.add('ok');
  nextRound();
});
const start = () => { score = 0; seed = (Math.random() * 2 ** 32) >>> 0; nextRound(); };
$('play').addEventListener('click', start);
$('replay').addEventListener('click', () => { if (now() - overAt >= REPLAY_LOCK_MS) start(); });
</script>
</body>
</html>
