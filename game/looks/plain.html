<!-- index.html — playable odd-one-out loop (slices 2–3): start, timed rounds, game over, best score, replay; progression from difficulty.js. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd One Out</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.4 system-ui, sans-serif; background: #f6f6f6; color: #222; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .screen.on { display: flex; }
  #round { justify-content: flex-start; }
  #stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  button.big { font: inherit; font-size: 20px; padding: 14px 40px; min-height: 48px; border: 0; border-radius: 10px; background: #222; color: #fff; }
  .hud { width: 100%; display: flex; justify-content: space-between; }
  .bar { width: 100%; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; width: 100%; background: #222; }
  #grid { width: 100%; display: grid; gap: 8px; touch-action: manipulation; border-radius: 8px; }
  #grid.ok { animation: ok 200ms; }
  @keyframes ok { from { box-shadow: 0 0 0 4px #2a2; } }
  #grid button.odd { outline: 4px solid #2a2; }
  #grid button.wrong { outline: 4px solid #d22; }
  #grid button { padding: 0; border: 1px solid #ccc; border-radius: 8px; background: #fff; aspect-ratio: 1; min-width: 44px; }
  #grid svg { width: 100%; height: 100%; display: block; }
  h1 { margin: 0; }
</style>
</head>
<body>
<main>
  <section id="start" class="screen on">
    <h1>Odd One Out</h1>
    <p>Tap the tile that breaks the rule.</p>
    <button class="big" id="play">Play</button>
  </section>
  <section id="round" class="screen">
    <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best1">0</b></span></div>
    <div class="bar"><div id="timer"></div></div>
    <div id="stage"><div id="grid"></div></div>
  </section>
  <section id="over" class="screen">
    <h1>Game over</h1>
    <p>Score <b id="final">0</b><br>Best <b id="best2">0</b></p>
    <button class="big" id="replay">Replay</button>
  </section>
</main>
<script type="module">
import { makeGrid } from './rules.js';
import { difficulty } from './difficulty.js';

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

const LOCK_MS = 250, REVEAL_MS = 600, REPLAY_LOCK_MS = 500;
let state = 'start', score = 0, grid = null, seed = 1, timeout = 0, readyAt = 0, overAt = 0;
const now = () => performance.now();
window.__game = { get state() { return state; }, get breakerIndex() { return grid ? grid.breakerIndex : -1; },
  get ready() { return state === 'round' && now() >= readyAt; } };

const loadBest = () => { try { return +localStorage.getItem('best') || 0; } catch { return 0; } };
const saveBest = (v) => { try { localStorage.setItem('best', String(v)); } catch {} };

function show(name) {
  state = name;
  for (const s of ['start', 'round', 'over']) $(s).classList.toggle('on', s === name);
}

function shapeEl({ x, y, shape, color }, r) {
  let el;
  if (shape === 'circle') {
    el = document.createElementNS(NS, 'circle');
    el.setAttribute('cx', x); el.setAttribute('cy', y); el.setAttribute('r', r);
  } else if (shape === 'square') {
    const s = r * 1.6;
    el = document.createElementNS(NS, 'rect');
    el.setAttribute('x', x - s / 2); el.setAttribute('y', y - s / 2); el.setAttribute('width', s); el.setAttribute('height', s);
  } else {
    el = document.createElementNS(NS, 'polygon');
    el.setAttribute('points', `${x},${y - r} ${x + r * 0.95},${y + r * 0.7} ${x - r * 0.95},${y + r * 0.7}`);
  }
  el.setAttribute('fill', color);
  return el;
}

function tileButton(tile, i, r) {
  const b = document.createElement('button');
  b.dataset.i = i;
  b.setAttribute('aria-label', `tile ${i + 1}`);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 1 1');
  tile.items.forEach((it) => svg.appendChild(shapeEl(it, r)));
  b.appendChild(svg);
  return b;
}

function nextRound() {
  clearTimeout(timeout);
  const { size, variety, rule, seconds, countRange, extraUniques } = difficulty(score + 1, seed);
  const ROUND_MS = seconds * 1000;
  grid = makeGrid({ size, variety, rule, countRange, extraUniques });
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${Math.sqrt(size)}, 1fr)`;
  g.replaceChildren(...grid.tiles.map((t, i) => tileButton(t, i, grid.itemR)));
  $('score').textContent = score;
  $('best1').textContent = Math.max(score, loadBest());
  show('round'); // visible before the bar restarts, or the transition never runs
  readyAt = now() + LOCK_MS; // swallow the second tap of a double tap
  const bar = $('timer');
  bar.style.transition = 'none'; bar.style.width = '100%';
  bar.offsetWidth; // restart the transition
  bar.style.transition = `width ${ROUND_MS}ms linear`; bar.style.width = '0%';
  timeout = setTimeout(lose, ROUND_MS);
}

function lose(wrong) { // show the true odd tile (and the wrong tap) before game over
  clearTimeout(timeout);
  state = 'reveal';
  const bar = $('timer');
  bar.style.width = getComputedStyle(bar).width; bar.style.transition = 'none';
  $('grid').children[grid.breakerIndex].classList.add('odd');
  wrong?.classList.add('wrong');
  timeout = setTimeout(gameOver, REVEAL_MS);
}

function gameOver() {
  overAt = now();
  const best = Math.max(score, loadBest());
  saveBest(best);
  $('final').textContent = score;
  $('best2').textContent = best;
  show('over');
}

$('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || state !== 'round' || now() < readyAt) return;
  if (+b.dataset.i !== grid.breakerIndex) return lose(b);
  score++;
  const g = $('grid'); g.classList.remove('ok'); g.offsetWidth; g.classList.add('ok');
  nextRound();
});
const start = () => { score = 0; seed = (Math.random() * 2 ** 32) >>> 0; nextRound(); };
$('play').addEventListener('click', start);
$('replay').addEventListener('click', () => { if (now() - overAt >= REPLAY_LOCK_MS) start(); });
</script>
</body>
</html>
