<!-- looks/geometric.html — "minimal geometric" visual variant of index.html (Swiss/Bauhaus). Game logic identical; only the visual layer differs. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd One Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efebe3;   /* page */
    --tile: #fffdf8;    /* tile surface; every item color is >= 3:1 against it */
    --ink: #1a1a1a;
    --mute: #8a847a;
    --hair: #d9d3c7;
    --accent: #e0301e;  /* the one strong accent */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 500 16px/1.35 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-feature-settings: 'tnum' 1; -webkit-font-smoothing: antialiased; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 24px 32px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.on { display: flex; }

  .label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .rule { height: 1px; background: var(--ink); width: 100%; }

  button.big { font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    width: 100%; min-height: 60px; border: 0; border-radius: 0; background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px; cursor: pointer; }
  button.big::after { content: ''; width: 14px; height: 14px; background: var(--accent); }
  button.big:active { background: var(--accent); }
  button.big:active::after { background: var(--paper); }

  /* start */
  #start { justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .mark { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 62%; margin: 40px 0 0; }
  .mark i { aspect-ratio: 1; background: var(--tile); display: flex; align-items: center; justify-content: center; }
  .mark i::before { content: ''; width: 34%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); }
  .mark i.x::before { border-radius: 0; background: var(--accent); }
  h1 { margin: 0; font-weight: 800; font-size: 64px; line-height: .9; letter-spacing: -.035em; }
  h1 span { color: var(--accent); }
  .lede { margin: 18px 0 0; max-width: 16em; color: #4a463f; font-size: 17px; }
  .foot { display: flex; flex-direction: column; gap: 14px; }

  /* round */
  .hud { display: flex; justify-content: space-between; align-items: last baseline; }
  .hud .n { display: block; font-weight: 800; font-size: 76px; line-height: .82; letter-spacing: -.04em; margin-top: 10px; }
  .hud .r { text-align: right; }
  .hud .r .n { font-size: 28px; font-weight: 700; color: var(--mute); }
  .bar { width: 100%; height: 2px; background: var(--hair); margin-top: 20px; overflow: hidden; }
  .bar div { height: 100%; width: 100%; background: var(--accent); }
  #stage { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 24px 0 20px; } /* grid sits in the thumb zone */
  .cap { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--ink); padding-top: 12px; }

  #grid { width: 100%; display: grid; gap: 6px; touch-action: manipulation; }
  #grid.ok { animation: ok 220ms ease-out; }
  @keyframes ok { from { transform: scale(.985); } }
  #grid button { padding: 0; border: 0; border-radius: 0; background: #fffdf8; aspect-ratio: 1; min-width: 44px; cursor: pointer;
    transition: background-color 120ms; -webkit-tap-highlight-color: transparent; }
  #grid button:active { background-color: #f7f3ea; }
  #grid button.odd { outline: 3px solid var(--ink); outline-offset: -3px; position: relative; z-index: 1; }
  #grid button.wrong { outline: 3px solid var(--accent); outline-offset: -3px; opacity: .55; }
  #grid svg { width: 100%; height: 100%; display: block; }

  /* over */
  #over { justify-content: space-between; gap: 24px; }
  .result { flex: 1; display: flex; flex-direction: column; }
  .result .n { display: block; font-weight: 800; font-size: 200px; line-height: .8; letter-spacing: -.06em; margin: 22px 0 0 -6px; }
  .result h1 { font-size: 40px; margin-top: 56px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); margin-top: auto; }
  .stats div { padding-top: 12px; }
  .stats b { display: block; font-size: 28px; font-weight: 700; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <section id="start" class="screen on">
    <div>
      <div class="top"><span class="label">No. 01</span><span class="label">Pattern / Speed</span></div>
      <div class="rule" style="margin-top:10px"></div>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="x"></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div>
      <h1>Odd<br>One<br>Out<span>.</span></h1>
      <p class="lede">Tap the tile that breaks the rule.</p>
    </div>
    <div class="foot">
      <button class="big" id="play">Play</button>
    </div>
  </section>
  <section id="round" class="screen">
    <div class="hud">
      <div><span class="label">Score</span><b class="n" id="score">0</b></div>
      <div class="r"><span class="label">Best</span><b class="n" id="best1">0</b></div>
    </div>
    <div class="bar"><div id="timer"></div></div>
    <div id="stage"><div id="grid"></div></div>
    <div class="cap"><span class="label">Find the odd one</span><span class="label" style="color:var(--accent)">&#9632;</span></div>
  </section>
  <section id="over" class="screen">
    <div class="result">
      <div class="top"><span class="label">Result</span><span class="label">Game over</span></div>
      <div class="rule" style="margin-top:10px"></div>
      <span class="label" style="display:block;margin-top:28px">Score</span>
      <b class="n" id="final">0</b>
      <div class="stats">
        <div><span class="label">Best</span><b id="best2">0</b></div>
        <div><span class="label">Status</span><b style="color:var(--accent)">Missed</b></div>
      </div>
    </div>
    <div class="foot">
      <button class="big" id="replay">Replay</button>
    </div>
  </section>
</main>
<script type="module">
import { makeGrid } from '../rules.js';
import { difficulty } from '../difficulty.js';

const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
// rules.js color tokens -> this look's palette (each >= 3:1 vs tile #fffdf8: 4.5, 8.2, 17.1, 4.4, 4.8).
const PALETTE = { '#ff0000': '#e0301e', '#0000ff': '#1f3fbf', '#008000': '#1a1a1a', '#c05800': '#a86a00', '#800080': '#5e7480' };

const LOCK_MS = 250, REVEAL_MS = 600, REPLAY_LOCK_MS = 500;
let state = 'start', score = 0, grid = null, seed = 1, timeout = 0, readyAt = 0, overAt = 0;
const now = () => performance.now();
window.__game = { get state() { return state; }, get breakerIndex() { return grid ? grid.breakerIndex : -1; },
  get ready() { return state === 'round' && now() >= readyAt; } };

const loadBest = () => { try { return +localStorage.getItem('best') || 0; } catch { return 0; } };
const saveBest = (v) => { try { localStorage.setItem('best', String(v)); } catch {} };

function show(name) {
  state = name;
  for (const s of ['start', 'round', 'over']) $(s).classList.toggle('on', s === name);
}

function shapeEl({ x, y, shape, color }, r) {
  let el;
  if (shape === 'circle') {
    el = document.createElementNS(NS, 'circle');
    el.setAttribute('cx', x); el.setAttribute('cy', y); el.setAttribute('r', r);
  } else if (shape === 'square') {
    const s = r * 1.6;
    el = document.createElementNS(NS, 'rect');
    el.setAttribute('x', x - s / 2); el.setAttribute('y', y - s / 2); el.setAttribute('width', s); el.setAttribute('height', s);
  } else {
    el = document.createElementNS(NS, 'polygon');
    el.setAttribute('points', `${x},${y - r} ${x + r * 0.95},${y + r * 0.7} ${x - r * 0.95},${y + r * 0.7}`);
  }
  el.setAttribute('fill', PALETTE[color] || color);
  return el;
}

function tileButton(tile, i, r) {
  const b = document.createElement('button');
  b.dataset.i = i;
  b.setAttribute('aria-label', `tile ${i + 1}`);
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 1 1');
  svg.setAttribute('shape-rendering', 'geometricPrecision');
  tile.items.forEach((it) => svg.appendChild(shapeEl(it, r)));
  b.appendChild(svg);
  return b;
}

function nextRound() {
  clearTimeout(timeout);
  const { size, variety, rule, seconds, countRange, extraUniques } = difficulty(score + 1, seed);
  const ROUND_MS = seconds * 1000;
  grid = makeGrid({ size, variety, rule, countRange, extraUniques });
  const g = $('grid');
  g.style.gridTemplateColumns = `repeat(${Math.sqrt(size)}, 1fr)`;
  g.replaceChildren(...grid.tiles.map((t, i) => tileButton(t, i, grid.itemR)));
  $('score').textContent = score;
  $('best1').textContent = Math.max(score, loadBest());
  show('round'); // visible before the bar restarts, or the transition never runs
  readyAt = now() + LOCK_MS; // swallow the second tap of a double tap
  const bar = $('timer');
  bar.style.transition = 'none'; bar.style.width = '100%';
  bar.offsetWidth; // restart the transition
  bar.style.transition = `width ${ROUND_MS}ms linear`; bar.style.width = '0%';
  timeout = setTimeout(lose, ROUND_MS);
}

function lose(wrong) { // show the true odd tile (and the wrong tap) before game over
  clearTimeout(timeout);
  state = 'reveal';
  const bar = $('timer');
  bar.style.width = getComputedStyle(bar).width; bar.style.transition = 'none';
  $('grid').children[grid.breakerIndex].classList.add('odd');
  wrong?.classList.add('wrong');
  timeout = setTimeout(gameOver, REVEAL_MS);
}

function gameOver() {
  overAt = now();
  const best = Math.max(score, loadBest());
  saveBest(best);
  $('final').textContent = score;
  $('best2').textContent = best;
  show('over');
}

$('grid').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || state !== 'round' || now() < readyAt) return;
  if (+b.dataset.i !== grid.breakerIndex) return lose(b);
  score++;
  const g = $('grid'); g.classList.remove('ok'); g.offsetWidth; g.classList.add('ok');
  nextRound();
});
const start = () => { score = 0; seed = (Math.random() * 2 ** 32) >>> 0; nextRound(); };
$('play').addEventListener('click', start);
$('replay').addEventListener('click', () => { if (now() - overAt >= REPLAY_LOCK_MS) start(); });
</script>
</body>
</html>
